  html[data-theme="cyan"] {

  html[data-theme="mono"] {

    --bg-body-glow: radial-gradient(ellipse 900px 500px at 20% -10%, rgba(255, 255, 255, 0.06), transparent 60%);

    --tab-chip-text: #e4e6ec;
    --tab-chip-border: rgba(255, 255, 255, 0.28);

  /* ---------- Schriftarten (unabhaengig vom Farbschema waehlbar) ---------- */
  html[data-font="orbitron"] { --font-display: 'Orbitron', 'Inter', sans-serif; }
  html[data-font="rajdhani"] { --font-display: 'Rajdhani', 'Inter', sans-serif; }
  html[data-font="bebas"] { --font-display: 'Bebas Neue', 'Inter', sans-serif; }
  html[data-font="chakra"] { --font-display: 'Chakra Petch', 'Inter', sans-serif; }
  html[data-font="audiowide"] { --font-display: 'Audiowide', 'Inter', sans-serif; }
  html[data-font="press-start"] { --font-display: 'Press Start 2P', 'JetBrains Mono', monospace; }

  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:
      var(--bg-body-glow),
      var(--bg-body);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 2px 0;
  }
  .sub { color: var(--text-sub); font-size: 13px; }
  .top-bar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
  }
  .status-strip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding: 4px 10px 4px 8px;
    background: var(--bg-card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    font-size: 12px;
    color: var(--text-heading);
    width: fit-content;
  }
  .status-strip .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--status-online-dot);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .picker-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .theme-picker {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .theme-picker label {
    font-size: 12px;
    color: var(--text-sub);
  }
  .theme-picker select {
    width: auto;
    margin-bottom: 0;
    padding: 7px 10px;
    font-size: 13px;
  }

  /* ---------- Konto-Leiste: Benutzer, Verwaltung, Abmelden ---------- */
  .account-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 8px;
  }
  .user-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px 5px 9px;
    background: var(--bg-card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    font-size: 12px;
    color: var(--text-heading);
    white-space: nowrap;
  }
  .user-chip svg { color: var(--text-sub); flex-shrink: 0; }
  .user-chip .role-tag {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent-strong);
  }
  .nav-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 13px;
    border-radius: 999px;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.2;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .nav-pill svg { flex-shrink: 0; }
  .nav-pill:active { transform: translateY(1px); }
  .nav-pill:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .nav-pill.accent {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
    color: var(--accent-strong);
  }
  .nav-pill.accent:hover {
    background: color-mix(in srgb, var(--accent) 24%, transparent);
    border-color: var(--accent);
  }
  .nav-pill.neutral {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-sub);
  }
  .nav-pill.neutral:hover {
    background: color-mix(in srgb, var(--text-sub) 10%, transparent);
    color: var(--text-main);
  }
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 14px 0;
    color: var(--text-heading);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .accounts-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .accounts-header h2 { margin: 0; }
  input, select, button {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--border-color);
    background: var(--bg-input);
    color: var(--input-text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  input, select { width: 100%; margin-bottom: 10px; }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  input::placeholder { color: var(--text-sub); }
  button {
    cursor: pointer;
    background: var(--accent);
    border: 1px solid transparent;
    color: var(--accent-text);
    font-weight: 600;
    font-family: var(--font-display);
    letter-spacing: 0.01em;
  }
  button:hover { background: var(--accent-strong); }
  button:active { transform: translateY(1px); }
  button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  button.stop {
    background: transparent;
    border-color: color-mix(in srgb, var(--danger) 45%, transparent);
    color: var(--danger);
  }
  button.stop:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); }
  button.ghost {
    background: transparent;
    border-color: var(--border-color);
    color: var(--text-sub);
  }
  button.ghost:hover {
    background: color-mix(in srgb, var(--danger) 14%, transparent);
    border-color: color-mix(in srgb, var(--danger) 45%, transparent);
    color: var(--danger);
  }
  button.small {
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 999px;
    margin-left: 0;
  }
  button.icon-btn {
    padding: 5px 7px;
    font-size: 12px;
    line-height: 1;
    border-radius: 999px;
  }
  .account-row {
    padding: 12px 0;
    border-bottom: 1px solid var(--border-row);
  }
  .account-row:last-child { border-bottom: none; }
  /* Einheitliche Account-Karte - immer gleich aufgebaut, egal welcher Status/Typ:
     Zeile 1: Name + Abzeichen links, Status rechts
     Zeile 2: feste Button-Plaetze (nicht passende Buttons bleiben ausgegraut stehen)
     Zeile 3: Uptime-Balken */
  .account-name-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 9px;
    min-width: 0;
  }
  .account-name-line strong {
    font-size: 14.5px;
    font-weight: 600;
    flex: 0 0 auto;
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .account-name-line .primary-badge { flex-shrink: 0; white-space: nowrap; }
  /* Bei Platzmangel wird zuerst der Status gekuerzt (voller Text als Tooltip), nicht der Name */
  .account-name-line .status {
    margin-left: auto;
    flex: 0 50 auto;
    min-width: 0;
    white-space: nowrap;
  }
  .status .status-text { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .account-buttons {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .account-buttons .btn-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .account-buttons button.small { min-width: 58px; height: 28px; padding: 0 10px; }
  .account-buttons button.icon-btn {
    width: 28px;
    height: 28px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .account-buttons button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .account-buttons button.ghost:disabled:hover {
    background: transparent;
    border-color: var(--border-color);
    color: var(--text-sub);
  }
  /* Stern beim Account, der gerade Chat-Quelle ist: hervorgehoben statt weggelassen */
  .account-buttons button.star-active:disabled,
  .account-buttons button.star-active:disabled:hover {
    opacity: 1;
    cursor: default;
    color: var(--accent-strong);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .account-buttons button.notify-off { opacity: 0.55; }
  .uptime-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .uptime-bar {
    flex: 1;
    height: 4px;
    background: var(--border-row);
    border-radius: 4px;
    overflow: hidden;
  }
  .uptime-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .autochat-area {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border-row);
  }
  .autochat-list { margin-bottom: 8px; }
  .autochat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border-row);
  }
  .autochat-item:last-child { border-bottom: none; }
  .autochat-item .tag {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent-strong);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius: 999px;
    padding: 1px 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    white-space: nowrap;
  }
  .autochat-item .delay-tag {
    background: var(--status-off-bg);
    color: var(--text-sub);
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 11px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .autochat-item .text { flex: 1; color: var(--text-main); font-family: 'JetBrains Mono', monospace; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .autochat-add-row {
    display: flex;
    gap: 6px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .autochat-add-row input { margin-bottom: 0; font-size: 12px; padding: 6px 8px; }
  .autochat-text-input { flex: 1; min-width: 120px; }
  .autochat-delay-input { width: 72px; flex-shrink: 0; }

  .uptime-text {
    font-size: 11px;
    color: var(--text-sub);
    white-space: nowrap;
    flex-shrink: 0;

// ---------- Eigene Dialoge (statt Browser-alert/confirm/prompt) ----------
const msgOverlay = document.getElementById('msgOverlay');
const msgBox = document.getElementById('msgBox');
const msgTitleEl = document.getElementById('msgTitle');
const msgTextEl = document.getElementById('msgText');
const msgInput = document.getElementById('msgInput');
const msgOkBtn = document.getElementById('msgOk');
const msgCancelBtn = document.getElementById('msgCancel');
let msgReturnFocus = null;
let msgResolve = null; // Aufloeser des gerade offenen Dialogs
let msgMode = 'alert';

function finishDialog(ok) {
  if (!msgOverlay.classList.contains('open')) return;
  const resolve = msgResolve;
  const mode = msgMode;
  const value = msgInput.value;
  msgResolve = null;
  msgOverlay.classList.remove('open');
  if (msgReturnFocus && typeof msgReturnFocus.focus === 'function') {
    try { msgReturnFocus.focus(); } catch (e) { /* egal */ }
  }
  msgReturnFocus = null;
  if (!resolve) return;
  if (mode === 'prompt') resolve(ok ? value : null);
  else if (mode === 'confirm') resolve(!!ok);
  else resolve(true);
}

function openDialog({ mode, text, title, isError = false, defaultValue = '', okLabel = 'OK', danger = false }) {
  // Ist schon ein Dialog offen, wird er als "abgebrochen" beendet
  if (msgOverlay.classList.contains('open')) finishDialog(false);
  msgReturnFocus = document.activeElement;
  msgMode = mode;
  msgBox.classList.toggle('error', (mode === 'alert' && !!isError) || !!danger);
  msgTitleEl.textContent = title || (mode === 'alert' ? (isError ? 'Fehler' : 'Hinweis') : (mode === 'confirm' ? 'Bestätigen' : 'Eingabe'));
  msgTextEl.textContent = String(text); // textContent: kein HTML moeglich
  msgInput.style.display = mode === 'prompt' ? 'block' : 'none';
  msgInput.value = mode === 'prompt' ? String(defaultValue) : '';
  msgCancelBtn.style.display = mode === 'alert' ? 'none' : '';
  msgOkBtn.textContent = okLabel;
  msgOkBtn.classList.toggle('danger-fill', !!danger);
  msgOverlay.classList.add('open');
  if (mode === 'prompt') { msgInput.focus(); msgInput.select(); }
  else if (mode === 'confirm' && danger) msgCancelBtn.focus(); // Enter loescht nicht versehentlich
  else msgOkBtn.focus();
  return new Promise((resolve) => { msgResolve = resolve; });
}

// Meldung (ersetzt alert). isError = true -> rote Variante, sonst neutraler Hinweis
function showMessage(text, isError = true) { openDialog({ mode: 'alert', text, isError }); }
// Ja/Nein-Frage (ersetzt confirm) -> Promise<boolean>
function showConfirm(text, opts = {}) { return openDialog({ mode: 'confirm', text, ...opts }); }
// Texteingabe (ersetzt prompt) -> Promise<string | null> (null = abgebrochen)
function showPrompt(text, defaultValue = '', opts = {}) { return openDialog({ mode: 'prompt', text, defaultValue, ...opts }); }

msgOkBtn.addEventListener('click', () => finishDialog(true));
msgCancelBtn.addEventListener('click', () => finishDialog(false));
msgOverlay.addEventListener('click', (e) => { if (e.target === msgOverlay) finishDialog(false); });
document.addEventListener('keydown', (e) => {
  if (!msgOverlay.classList.contains('open')) return;
  if (e.key === 'Escape') { e.preventDefault(); finishDialog(false); return; }
  if (e.key === 'Enter' && e.target === msgInput) { e.preventDefault(); finishDialog(true); return; }
  if (e.key === 'Tab') {
    // Fokus im Dialog halten
    const items = [msgInput, msgCancelBtn, msgOkBtn].filter((el) => el.getClientRects().length > 0);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

function launchConfetti() {
  const colors = ['#4f8cff', '#52e08a', '#f6b94f', '#ef5b5b', '#c9a3ff'];
  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.inset = '0';
  container.style.pointerEvents = 'none';
  container.style.zIndex = '9999';
  document.body.appendChild(container);

  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    const size = 6 + Math.random() * 6;
    piece.style.position = 'absolute';
    piece.style.top = '-20px';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.width = size + 'px';
    piece.style.height = size * 0.6 + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.opacity = '0.9';
    piece.style.borderRadius = '2px';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    const duration = 2200 + Math.random() * 1400;
    const drift = (Math.random() - 0.5) * 200;
    piece.animate(
      [
        { transform: `translate(0, 0) rotate(0deg)`, opacity: 0.9 },
        { transform: `translate(${drift}px, 100vh) rotate(${360 + Math.random() * 360}deg)`, opacity: 0.6 },
      ],
      { duration, easing: 'ease-in', fill: 'forwards' }
    );
    container.appendChild(piece);
  }

  setTimeout(() => container.remove(), 3800);
}

function initCat() {
  const svg = document.getElementById('catSvg');
  const stage = document.getElementById('catStage');
  const bubble = document.getElementById('catBubble');
  const pupils = svg.querySelectorAll('.cat-pupil');
  if (!svg) return;

  document.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.35;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const dist = Math.hypot(dx, dy);

    const eyeDist = Math.min(2.4, dist / 60);
    const angle = Math.atan2(dy, dx);
    const ox = Math.cos(angle) * eyeDist;
    const oy = Math.sin(angle) * eyeDist;
    pupils.forEach((p) => {
      p.style.transform = `translate(${ox}px, ${oy}px)`;
    });

    // Kleines Versteckspiel: wenn der Mauszeiger sehr nah kommt, weicht die Katze kurz aus
    if (dist < 55 && Date.now() > dodgeCooldownUntil) {
      dodgeCooldownUntil = Date.now() + 2500;
      const dodgeX = dx >= 0 ? -22 : 22;
      stage.style.transform = `translateX(${dodgeX}px)`;
      setTimeout(() => {
        stage.style.transform = '';
      }, 380);
    }
  });

  svg.addEventListener('click', () => {
    svg.classList.remove('cat-bounce');
    void svg.offsetWidth; // Reflow erzwingen, damit die Animation neu startet
    svg.classList.add('cat-bounce');
    showCatBubble(catMessages[Math.floor(Math.random() * catMessages.length)]);
  });
}

// ---------- Frei laufende Katze am unteren Rand ----------
function initRoamingCat() {
  const strip = document.getElementById('roamStrip');
  const cat = document.getElementById('roamCat');
  if (!strip || !cat) return;

  let pos = Math.random() * 100;
  let dir = 1;
  let pauseUntil = 0;
  const speed = 0.55; // Pixel pro Frame

  function frame(time) {
    const maxX = strip.clientWidth - cat.clientWidth;
    if (maxX > 0) {
      if (time > pauseUntil) {
        pos += dir * speed;
        if (pos >= maxX) {
          pos = maxX;
          dir = -1;
          pauseUntil = time + 800 + Math.random() * 1200; // kurze Verschnaufpause an den Raendern
        } else if (pos <= 0) {
          pos = 0;
          dir = 1;
          pauseUntil = time + 800 + Math.random() * 1200;
        }
      }
      cat.style.transform = `translateX(${pos}px) scaleX(${dir})`;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

async function handleTabComplete() {
  const input = document.getElementById('chatInput');
  const username = chatAccountSelect.value;
  if (!username) return;

  // Wenn wir schon mitten in einem Tab-Zyklus sind (z.B. per Taste/Button mehrfach gedrueckt),
  // einfach zum naechsten Treffer springen
  if (tabState && tabState.matches.length > 0) {
    tabState.index = (tabState.index + 1) % tabState.matches.length;
    applyTabMatch(input, tabState);
    renderTabSuggestions();
    return;
  }

  const text = input.value;

  if (text.startsWith('/')) {
    // Server-seitige Befehls-Vervollstaendigung (wie im echten Minecraft-Chat)
    try {
      const res = await fetch('/api/tabcomplete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, text }),
      });
      const data = await res.json();
      if (data.matches && data.matches.length > 0) {
        tabState = {
          matches: data.matches,
          index: 0,
          baseText: text,
          start: typeof data.start === 'number' ? data.start : null,
          length: typeof data.length === 'number' ? data.length : null,
        };
        applyTabMatch(input, tabState);
        renderTabSuggestions();
      }
    } catch (e) {
      // still, kein Treffer
    }
  } else {
    // Spielername-Vervollstaendigung anhand aktuell online sichtbarer Spieler
    const parts = text.split(' ');
    const lastWord = parts[parts.length - 1];
    if (!lastWord) return;
    try {
      const res = await fetch('/api/players/' + encodeURIComponent(username));
      const data = await res.json();
      const matches = (data.players || []).filter((p) =>
        p.toLowerCase().startsWith(lastWord.toLowerCase())
      );
      if (matches.length > 0) {
        tabState = { matches, index: 0, baseText: text, start: null, length: null };
        applyTabMatch(input, tabState);
        renderTabSuggestions();
      }
    } catch (e) {
      // kein Treffer
    }
  }
}

function renderTabSuggestions() {
  tabSuggestionsEl.innerHTML = '';
  if (!tabState || tabState.matches.length <= 1) return;
  tabState.matches.forEach((m, i) => {
    const chip = document.createElement('span');
    chip.className = 'tab-chip' + (i === tabState.index ? ' active' : '');
    chip.textContent = m;
    chip.onclick = () => {
      tabState.index = i;
      applyTabMatch(document.getElementById('chatInput'), tabState);
      renderTabSuggestions();
      document.getElementById('chatInput').focus();
    };
    tabSuggestionsEl.appendChild(chip);
  });
}

function applyTabMatch(input, state) {
  const match = state.matches[state.index];
  if (state.start !== null && state.length !== null) {
    // Server hat uns genau gesagt, welchen Bereich wir ersetzen sollen
    const before = state.baseText.slice(0, state.start);
    const after = state.baseText.slice(state.start + state.length);
    input.value = before + match + after;
  } else if (state.start === null && state.baseText.startsWith('/')) {
    // Kein Bereich vom Server bekannt -> ganzen Text durch den Treffer ersetzen
    input.value = match;
  } else {
    // Spielername: letztes Wort ersetzen
    const parts = state.baseText.split(' ');
    parts[parts.length - 1] = match;
    input.value = parts.join(' ');
  }
  input.setSelectionRange(input.value.length, input.value.length);
}

  if (delayEl) delayEl.value = '';
}
async function deleteAutoChat(username, index) {
  await fetch('/api/accounts/' + encodeURIComponent(username) + '/autochat/' + index, { method: 'DELETE' });
}
async function renameAccountPrompt(username) {
  const newName = await showPrompt(`Neuer Name für ${username}:`, username, {
    title: 'Account umbenennen',
    okLabel: 'Umbenennen',
  });
  if (!newName) return;
  const trimmed = newName.trim();
  if (!trimmed || trimmed === username) return;
  const res = await fetch('/api/accounts/' + encodeURIComponent(username) + '/rename', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ newUsername: trimmed }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) showMessage(data.error || 'Fehler beim Umbenennen');
}
async function startAllAccounts() {
  await fetch('/api/start-all', { method: 'POST' });
}
async function stopAllAccounts() {
  await fetch('/api/stop-all', { method: 'POST' });
}
function statusClass(status) {
  if (status === 'online') return 'online';
  if (status === 'gestoppt') return 'gestoppt';
  if (status && status.startsWith('Warteschlange')) return 'queue';
  return 'other';
}

function formatDuration(ms) {
  const totalMin = Math.floor((ms || 0) / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function renderAccounts(accounts) {
  accountListEl.innerHTML = '';

  const previousChatSelection = chatAccountSelect.value;
  // Offene Auto-Chat-Bereiche merken, damit sie nach dem Rendern wieder aufgeklappt sind
  const openAutoChatPanels = new Set(
    Array.from(document.querySelectorAll('[id^="autochat-"]'))
      .filter((el) => el.style.display !== 'none')
      .map((el) => el.id.slice('autochat-'.length))
  );
  chatAccountSelect.innerHTML = '';

  const previousControlSelection = controlAccountSelect.value;
  controlAccountSelect.innerHTML = '';

  accounts.forEach((acc, index) => {
    const row = document.createElement('div');
    row.className = 'account-row';

    const isPrimary = acc.isPrimary;
    const isBedrock = acc.username.startsWith('.');
    const canManage = myRole === 'owner' || myRole === 'admin';
    const uptimePct = Math.min(100, ((acc.uptimeMs || 0) / (8 * 60 * 60 * 1000)) * 100);
    const autoChatHtml = (acc.autoChat || []).map((a, i) =>
      `<div class="autochat-item">
        <span class="text">${escapeHtml(a.text)}</span>
        <span class="delay-tag">${a.delaySeconds}s</span>
        <button class="icon-btn ghost" onclick="deleteAutoChat(${jsArg(acc.username)},${i})" title="Entfernen">✕</button>
      </div>`
    ).join('');

    // Feste Button-Plaetze: jeder Button steht bei jedem Account an derselben Stelle.
    // Was fuer einen Account nicht moeglich ist, bleibt ausgegraut stehen statt zu fehlen.
    const notifyOn = acc.notifyElsewhere !== false;
    let starBtn = '';
    let notifyBtn = '';
    if (canManage) {
      if (isPrimary) {
        starBtn = `<button class="icon-btn ghost star-active" disabled title="Ist die aktuelle Chat-Quelle">★</button>`;
      } else if (isBedrock) {
        starBtn = `<button class="icon-btn ghost" disabled title="Bedrock-Accounts können keine Chat-Quelle sein">★</button>`;
      } else {
        starBtn = `<button class="icon-btn ghost" onclick="makePrimary(${jsArg(acc.username)})" title="Als Chat-Quelle festlegen">★</button>`;
      }
      notifyBtn = isBedrock
        ? `<button class="icon-btn ghost" disabled title="Bei Bedrock-Accounts nicht verfügbar">🔔</button>`
        : `<button class="icon-btn ghost${notifyOn ? '' : ' notify-off'}" onclick="toggleNotifyElsewhere(${jsArg(acc.username)}, ${notifyOn})" title="${notifyOn ? 'Discord-Meldung bei &quot;anderswo eingeloggt&quot;: AN (klicken zum Ausschalten)' : 'Discord-Meldung bei &quot;anderswo eingeloggt&quot;: AUS (klicken zum Einschalten)'}">${notifyOn ? '🔔' : '🔕'}</button>`;
    }
    const statusText = escapeHtml(acc.status || '');

    row.innerHTML = `
      <div class="account-name-line">
        <strong title="${escapeHtml(acc.username)}">${escapeHtml(acc.username)}</strong>
        ${isPrimary ? '<span class="primary-badge">Chat-Quelle</span>' : ''}
        ${isBedrock ? '<span class="primary-badge" style="background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent-strong);border-color:color-mix(in srgb,var(--accent) 35%,transparent)">🎮 Bedrock</span>' : ''}
        ${(canManage && (acc.autoChat || []).length > 0) ? `<span class="primary-badge" style="background:color-mix(in srgb,var(--status-other-dot) 15%,transparent);color:var(--status-other-text);border-color:color-mix(in srgb,var(--status-other-dot) 35%,transparent)">⏱ ${acc.autoChat.length}</span>` : ''}
        <span class="status ${statusClass(acc.status)}" title="${statusText}"><span class="status-text">${statusText}</span></span>
      </div>
      <div class="account-buttons">
        <div class="btn-group">
          ${starBtn}
          <button class="small" onclick="startAccount(${jsArg(acc.username)})">Start</button>
          <button class="small stop" onclick="stopAccount(${jsArg(acc.username)})">Stop</button>
        </div>
        ${canManage ? `<div class="btn-group">
          <button class="icon-btn ghost" onclick="renameAccountPrompt(${jsArg(acc.username)})" title="Umbenennen">✏️</button>
          ${notifyBtn}
          <button class="icon-btn ghost" onclick="toggleAutoChat(${jsArg(acc.username)})" title="Auto-Chat bearbeiten">⚙️</button>
          <button class="icon-btn ghost" onclick="removeAccount(${jsArg(acc.username)})" title="Entfernen">✕</button>
        </div>` : ''}
      </div>
      <div class="uptime-row">
        <div class="uptime-bar"><div class="uptime-fill" style="width:${uptimePct}%"></div></div>
        <span class="uptime-text">${formatDuration(acc.uptimeMs)} heute</span>
      </div>
      ${canManage ? `<div class="autochat-area" id="autochat-${escapeHtml(acc.username)}" style="display:none;">
        <div class="autochat-list">${autoChatHtml || '<span style="font-size:12px;color:var(--text-sub)">Noch keine Auto-Chat-Aktionen.</span>'}</div>
        <div class="autochat-add-row">
          <input class="autochat-text-input" id="autochat-text-${escapeHtml(acc.username)}" placeholder='Text oder Befehl, z.B. /hide' />
          <input class="autochat-delay-input" id="autochat-delay-${escapeHtml(acc.username)}" type="number" min="0" placeholder="Sek." />
          <button class="small" onclick="addAutoChat(${jsArg(acc.username)})">+ Hinzufügen</button>
        </div>
      </div>` : ''}
    `;
    accountListEl.appendChild(row);

    // Chat-Dropdown: ALLE Accounts (Bedrock kann Chat und Befehle senden).
    // Steuerungs-Dropdown: nur Java-Accounts (Bedrock hat keine Ingame-Steuerung).
    const opt = document.createElement('option');
    opt.value = acc.username;
    opt.textContent = isBedrock ? `${acc.username} (Bedrock)` : acc.username;
    chatAccountSelect.appendChild(opt);

    if (!isBedrock) {
      const ctrlOpt = document.createElement('option');
      ctrlOpt.value = acc.username;
      ctrlOpt.textContent = acc.username;
      controlAccountSelect.appendChild(ctrlOpt);
    }
  });

  if (accounts.some((a) => a.username === previousChatSelection)) {
    chatAccountSelect.value = previousChatSelection;
  }
  if (accounts.some((a) => a.username === previousControlSelection)) {
    controlAccountSelect.value = previousControlSelection;
  }
  openAutoChatPanels.forEach((username) => {
    const el = document.getElementById('autochat-' + username);
    if (el) el.style.display = 'block';
  });

  updateStatusStrip(accounts);
  reactCatToStatus(accounts);
}

let lastOnlineCount = null;
let lastTotalCount = null;

function reactCatToStatus(accounts) {
  const total = accounts.length;
  const online = accounts.filter((a) => a.status === 'online').length;

  if (lastOnlineCount === null) {
    // Erster Ladevorgang, nur Zustand merken, nicht reagieren
    lastOnlineCount = online;
    lastTotalCount = total;
    return;
  }

  if (total > 0 && online === total && (lastOnlineCount !== online || lastTotalCount !== total)) {
    catHappy();
    if (lastOnlineCount < online) launchConfetti();
  } else if (total > 0 && online === 0 && lastOnlineCount > 0) {
    catSad();
  }

  lastOnlineCount = online;
  lastTotalCount = total;
}

function updateStatusStrip(accounts) {
  const el = document.getElementById('statusStripText');
  const dot = document.querySelector('#statusStrip .dot');
  const total = accounts.length;
  const online = accounts.filter((a) => a.status === 'online').length;
  el.textContent = `${online} / ${total} online`;
  dot.style.background = online > 0 ? 'var(--status-online-dot)' : 'var(--status-off-dot)';
}

function updateChatStatusDisplay() {
  if (!primaryUsername) {
    chatPrimaryInfo.textContent = '(kein Account vorhanden)';
    showChatOff('Noch kein Account hinzugefügt.');
  } else if (!chatActive) {
    chatPrimaryInfo.textContent = `(${primaryUsername} - offline)`;
    showChatOff(`Chat ist aus, weil ${primaryUsername} gerade nicht läuft.`);
  } else {
    chatPrimaryInfo.textContent = `(${primaryUsername})`;
  }
}

function showChatOff(text) {
  chatlogEl.innerHTML = `<div class="chat-off">${escapeHtml(text)}</div>`;
}

let chatHistoryData = []; // gesamter im Browser gesammelter Verlauf (fuer Suche/Export)
let chatSearchTerm = '';
const CHAT_HISTORY_CLIENT_LIMIT = 3000;

function renderChatHistory(history) {
  chatHistoryData = history.slice();
  redrawChatLog();
}

function redrawChatLog() {
  chatlogEl.innerHTML = '';
  if (!chatActive) {
    updateChatStatusDisplay();
    return;
  }

  const term = chatSearchTerm.trim().toLowerCase();
  const filtered = term
    ? chatHistoryData.filter((m) => m.text.toLowerCase().includes(term))
    : chatHistoryData;

  if (filtered.length === 0) {
    chatlogEl.innerHTML = term
      ? '<div class="chat-off">Keine Treffer für diese Suche.</div>'
      : '<div class="chat-off">Noch keine Nachrichten in den letzten 10 Minuten.</div>';
    return;
  }
  filtered.forEach((m) => appendChatLine(m));
  chatlogEl.scrollTop = chatlogEl.scrollHeight;
}

function addChatLine(msg) {
  chatHistoryData.push(msg);
  if (chatHistoryData.length > CHAT_HISTORY_CLIENT_LIMIT) {
    chatHistoryData = chatHistoryData.slice(-CHAT_HISTORY_CLIENT_LIMIT);
  }
  const term = chatSearchTerm.trim().toLowerCase();
  if (term && !msg.text.toLowerCase().includes(term)) return;
  appendChatLine(msg);
  chatlogEl.scrollTop = chatlogEl.scrollHeight;
}

function appendChatLine(msg) {
  const line = document.createElement('div');
  line.className = 'chat-line';
  const time = new Date(msg.ts).toLocaleTimeString();
  line.innerHTML = `<span class="chat-user">[${time}]</span> ${escapeHtml(msg.text)}`;
  chatlogEl.appendChild(line);
}

document.getElementById('chatSearch').addEventListener('input', (e) => {
  chatSearchTerm = e.target.value;
  redrawChatLog();
});

document.getElementById('exportChatBtn').addEventListener('click', () => {
  if (chatHistoryData.length === 0) return;
  const lines = chatHistoryData.map((m) => `[${new Date(m.ts).toLocaleString()}] ${m.text}`);
  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `chat-verlauf-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

// Text sicher in HTML einsetzen - auch in Attribute (deshalb auch " und ')
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
// Wert sicher als Argument in onclick="..." einsetzen
function jsArg(v) {
  return escapeHtml(JSON.stringify(String(v ?? '')));
}

function showMsaBox(data) {
  let box = msaBoxes[data.username];
  if (!box) {
    box = document.createElement('div');
    box.className = 'msa-box';
    msaContainer.appendChild(box);
    msaBoxes[data.username] = box;
  }
  box.innerHTML = `
    <div><strong>Microsoft-Login nötig für ${escapeHtml(data.username)}</strong></div>
    <div><a href="${escapeHtml(data.directUri || data.verificationUri)}" target="_blank" rel="noopener"><strong>👉 Hier klicken und anmelden</strong></a> – der Code ist im Link schon eingetragen.</div>
    <div>Falls doch nach einem Code gefragt wird (auf <a href="${escapeHtml(data.verificationUri)}" target="_blank" rel="noopener">${escapeHtml(data.verificationUri)}</a>):</div>
    <div class="msa-code">${escapeHtml(data.userCode)}</div>
  `;
}

function removeMsaBox(username) {
  const box = msaBoxes[username];
  if (box) {
    box.remove();
    delete msaBoxes[username];
  }
}

// ---------- Socket-Events ----------
let lastAccountsList = [];
socket.on('accounts', (list) => {
  lastAccountsList = list;
  renderAccounts(list);
});

socket.on('chat-status', (data) => {
  primaryUsername = data.primary;
  chatActive = data.active;
  updateChatStatusDisplay();
});

socket.on('chat-state', (data) => {
  primaryUsername = data.primary;
  chatActive = data.active;
  renderChatHistory(data.history);
});

socket.on('chat', (msg) => {
  if (chatActive) addChatLine(msg);
});

socket.on('msa-code', showMsaBox);
socket.on('msa-code-clear', (data) => removeMsaBox(data.username));

// ---------- Ingame-Steuerung ----------
function getControlUsername() {
  return controlAccountSelect.value;
}

async function sendMove(direction, pressed) {
  const username = getControlUsername();
  if (!username) return;
  try {
    await fetch('/api/control/' + encodeURIComponent(username) + '/move', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ direction, state: pressed }),
    });
  } catch (e) {
    // still, kein Blockieren der UI bei kurzen Netzwerkhakeln
  }
}

function wireHoldButton(btnId, direction) {
  const btn = document.getElementById(btnId);
  const press = (e) => {
    e.preventDefault();
    sendMove(direction, true);
  };
  const release = (e) => {
    e.preventDefault();
    sendMove(direction, false);
  };
  btn.addEventListener('mousedown', press);
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
  btn.addEventListener('touchend', release);
  btn.addEventListener('touchcancel', release);
}

wireHoldButton('ctrlForward', 'forward');
wireHoldButton('ctrlBack', 'back');
wireHoldButton('ctrlLeft', 'left');
wireHoldButton('ctrlRight', 'right');
wireHoldButton('ctrlJump', 'jump');

let sneakActive = false;
document.getElementById('ctrlSneak').addEventListener('click', () => {
  sneakActive = !sneakActive;
  document.getElementById('ctrlSneak').classList.toggle('active', sneakActive);
  sendMove('sneak', sneakActive);
});

document.getElementById('ctrlDismount').addEventListener('click', async () => {
  const username = getControlUsername();
  if (!username) return;
  await fetch('/api/control/' + encodeURIComponent(username) + '/dismount', { method: 'POST' });
});

document.getElementById('ctrlLeftclick').addEventListener('click', async () => {
  const username = getControlUsername();
  if (!username) return;
  await fetch('/api/control/' + encodeURIComponent(username) + '/leftclick', { method: 'POST' });
});

document.getElementById('ctrlRightclick').addEventListener('click', async () => {
  const username = getControlUsername();
  if (!username) return;
  await fetch('/api/control/' + encodeURIComponent(username) + '/rightclick', { method: 'POST' });
});

async function sendDrop(all) {
  const username = getControlUsername();
  if (!username) return;
  const res = await fetch('/api/control/' + encodeURIComponent(username) + '/drop', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ all }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) showMessage(data.error || 'Fehler beim Droppen');
}
document.getElementById('ctrlDrop').addEventListener('click', () => sendDrop(false));
document.getElementById('ctrlDropAll').addEventListener('click', () => sendDrop(true));

const hotbarRow = document.getElementById('hotbarRow');
for (let i = 0; i < 9; i++) {
  const btn = document.createElement('button');
  btn.className = 'small ghost hotbar-btn';
  btn.textContent = String(i + 1);
  btn.addEventListener('click', async () => {
    const username = getControlUsername();
    if (!username) return;
    await fetch('/api/control/' + encodeURIComponent(username) + '/hotbar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slot: i }),
    });
  });
  hotbarRow.appendChild(btn);
}
